<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Fix for dynamic item card hover overlays in trade grids for dark theme */
        .dark-mode #yourTradeGrid div[class*="group-hover"], 
        .dark-mode #theirTradeGrid div[class*="group-hover"] {
            background-color: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
        }
        #yourTradeGrid div[class*="group-hover"] { border-radius: 1.5rem; background-color: rgba(255, 255, 255, 0.9); }
        .dark-mode #yourTradeGrid .text-slate-900, .dark-mode #theirTradeGrid .text-slate-900 { color: white !important; }

        /* Hide name and value in picker grid to make it more compact */
        #pickerGrid span:not(.rarity), #pickerGrid p, #pickerGrid h3, #pickerGrid h4 { display: none !important; }
    </style>
</head>
<body class="text-slate-900 antialiased">
    <header></header>

    <main class="max-w-[1200px] mx-auto px-4 pt-12 pb-12">
        <div class="grid grid-cols-1 md:grid-cols-[1fr_200px_1fr] gap-12 items-center">
            <!-- Left Side: You -->
            <div class="reveal p-8 bg-white dark:bg-slate-900 border border-transparent dark:border-white/10 rounded-[3rem] shadow-sm hover:-translate-y-1 transition-all duration-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-normal tracking-tight dark:text-white">
                        <span>Your Offer</span>
                    </h2>
                    <div class="flex items-center gap-3">
                        <span id="yourTotal" class="text-indigo-600 font-semibold">0</span>
                        <button onclick="clearTrade('your')" class="text-[9px] uppercase tracking-[0.2em] px-2 py-0.5 bg-slate-100 dark:bg-white/5 rounded-md text-slate-400 hover:text-red-500 transition-all leading-none">Clear</button>
                    </div>
                </div>
                <div class="mb-4 text-[10px] text-slate-400 dark:text-white uppercase tracking-widest">
                    Items: <span id="yourItemCount" class="text-indigo-500">0</span>
                </div>
                <div id="yourTradeGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-4 min-h-[200px] mb-6">
                    <!-- Items added here -->
                </div>
                <div class="flex flex-col gap-4">
                    <button onclick="showItemPicker('your')" class="w-full py-4 border-2 border-dashed border-slate-200 dark:border-white/10 rounded-[2rem] text-slate-400 hover:border-indigo-400 hover:text-indigo-600 dark:hover:bg-white/5 transition-all text-sm font-normal tracking-wide">+ ADD ITEM</button>
                    <div class="flex items-center gap-3 bg-slate-50/80 dark:bg-white/5 p-4 rounded-[2rem] transition-all">
                        <div class="flex flex-col min-w-[60px]">
                            <span class="text-[9px] font-normal uppercase tracking-widest text-slate-400 dark:text-white">Gems</span>
                            <span id="yourGemsDisplay" class="text-[12px] font-normal text-indigo-600 leading-tight"></span>
                        </div>
                        <input type="number" id="yourGems" min="0" step="100000" placeholder="0 gems..." class="bg-transparent w-full !border-0 !shadow-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none outline-none focus:outline-none focus:ring-0 text-base text-right pr-2 font-normal text-indigo-600" oninput="if(typeof updateTradeTotals === 'function') updateTradeTotals()">
                    </div>
            </div>
            </div>

            <!-- Center: Verdict -->
            <div id="verdictBanner" class="flex flex-col items-center justify-center text-center mx-auto shrink-0">
                <span class="text-[11px] font-normal uppercase tracking-[0.3em] text-slate-400 dark:text-white mb-2 block">Verdict</span>
                <h3 id="verdictText" class="text-6xl font-normal tracking-tighter transition-all duration-500 dark:text-white">F</h3>
                <button onclick="generateShareLink()" class="mt-6 px-6 py-2.5 bg-blue-600 text-white rounded-2xl text-[10px] uppercase tracking-widest font-normal hover:bg-blue-700 transition-all shadow-md">Generate Share Link</button>
                <div class="w-24 h-1 bg-slate-100 dark:bg-white/10 rounded-full mt-4 overflow-hidden">
                    <div id="fairnessMeter" class="h-full bg-indigo-600 transition-all duration-500" style="width: 50%"></div>
                </div>
            </div>

            <!-- Right Side: Them -->
            <div class="reveal p-8 bg-white dark:bg-slate-900 border border-transparent dark:border-white/10 rounded-[3rem] shadow-sm hover:-translate-y-1 transition-all duration-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-normal tracking-tight dark:text-white">
                        <span>Their Offer</span>
                    </h2>
                    <div class="flex items-center gap-3">
                        <span id="theirTotal" class="text-emerald-600 font-semibold">0</span>
                        <button onclick="clearTrade('their')" class="text-[9px] uppercase tracking-[0.2em] px-2 py-0.5 bg-slate-100 dark:bg-white/5 rounded-md text-slate-400 hover:text-red-500 transition-all leading-none">Clear</button>
                    </div>
                </div>
                <div class="mb-4 text-[10px] text-slate-400 dark:text-white uppercase tracking-widest">
                    Items: <span id="theirItemCount" class="text-emerald-500">0</span>
                </div>
                <div id="theirTradeGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-4 min-h-[200px] mb-6">
                    <!-- Items added here -->
                </div>
                <div class="flex flex-col gap-4">
                    <button onclick="showItemPicker('their')" class="w-full py-4 border-2 border-dashed border-slate-200 dark:border-white/10 rounded-[2rem] text-slate-400 hover:border-emerald-400 hover:text-emerald-600 dark:hover:bg-white/5 transition-all text-sm font-normal tracking-wide">+ ADD ITEM</button>
                    <div class="flex items-center gap-3 bg-slate-50/80 dark:bg-white/5 p-4 rounded-[2rem] transition-all">
                        <div class="flex flex-col min-w-[60px]">
                            <span class="text-[9px] font-normal uppercase tracking-widest text-slate-400 dark:text-white">Gems</span>
                            <span id="theirGemsDisplay" class="text-[12px] font-normal text-emerald-600 leading-tight"></span>
                        </div>
                        <input type="number" id="theirGems" min="0" step="100000" placeholder="0 gems..." class="bg-transparent w-full !border-0 !shadow-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none outline-none focus:outline-none focus:ring-0 text-base text-right pr-2 font-normal text-emerald-600" oninput="if(typeof updateTradeTotals === 'function') updateTradeTotals()">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <!-- Quantity Selector Modal (Fixed: Added missing element) -->
    <div id="quantitySelector" class="fixed inset-0 z-[110] invisible opacity-0 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm transition-all duration-300 pointer-events-none">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/10 rounded-[2.5rem] max-w-[280px] w-full p-6 shadow-2xl transform transition-all duration-300">
            <div class="flex flex-col items-center text-center">
                <div class="w-20 h-20 mb-2">
                    <img id="qtyPetImage" src="" class="w-full h-full object-contain">
                </div>
                <h3 id="qtyPetName" class="hidden"></h3>
                <p id="qtyPetValue" class="hidden"></p>
                
                <div class="flex items-center gap-4 mb-6">
                    <button onclick="adjustQuantity(-1)" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white text-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-white/5 font-bold">-</button>
                    <input type="number" id="itemQuantityInput" value="1" class="w-20 text-center text-2xl bg-transparent !border-0 !ring-0 !outline-none !shadow-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none text-slate-900 dark:text-white font-bold">
                    <button onclick="adjustQuantity(1)" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white text-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-white/5 font-bold">+</button>
                </div>
                
                <div class="flex gap-3 w-full">
                    <button onclick="cancelQuantitySelection()" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl text-[10px] uppercase tracking-widest hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">Cancel</button>
                    <button onclick="confirmAddItem()" class="flex-1 py-3 bg-indigo-600 text-white rounded-2xl text-[10px] uppercase tracking-widest hover:bg-indigo-700 transition-all">Add to Trade</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Item Selection Modal -->
    <div id="pickerModal" class="fixed inset-0 z-[100] invisible opacity-0 flex items-center justify-center p-4 bg-slate-950/80 transition-all duration-300 pointer-events-none">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/10 rounded-[32px] max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col transform transition-transform duration-300">
            <div class="p-6 border-b border-slate-50 dark:border-white/5 flex justify-between items-center">
                <input type="text" id="pickerSearch" placeholder="Search items..." class="!bg-transparent !border-0 !shadow-none px-4 py-2 rounded-xl text-sm outline-none focus:outline-none focus:ring-0 transition-all w-full mr-4 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500" oninput="renderPickerGrid()">
                <select id="pickerRarity" class="bg-transparent text-slate-400 text-[11px] font-normal uppercase tracking-wider cursor-pointer hover:text-indigo-400 transition-colors focus:outline-none mr-4" onchange="renderPickerGrid()">
                    <option value="all">All</option>
                    <option value="Huge">Huge</option>
                </select>
                <button onclick="closePicker()" class="text-slate-400">&times;</button>
            </div>
            <div id="pickerGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 p-6 overflow-y-auto font-normal"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[70] bg-blue-600 text-white px-6 py-3 rounded-2xl font-normal text-sm opacity-0 invisible translate-y-10 transition-all duration-300 pointer-events-none">Copied!</div>

    <script src="animations.js"></script>
    <script src="utils.js"></script>
    <script src="components.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
