<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITY - Pet Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-900 antialiased dark:bg-slate-950">
    <header></header>

    <main class="max-w-[1600px] mx-auto px-4 pt-12 pb-12">
        <div id="marketStats" class="reveal mb-6 px-2 flex items-center gap-6 border-b border-slate-100 dark:border-white/5 pb-4">
            <div class="flex flex-col">
                <span id="marketLabel" class="text-[8px] uppercase tracking-widest text-slate-400">Database Market</span>
                <span class="text-[10px] text-indigo-600 font-bold"><span id="totalPets">0</span> Items • <span id="marketValue">0</span></span>
            </div>
        </div>

        <div id="collectionStats" class="reveal mb-8 px-2 hidden"></div>

        <div id="petGrid" class="reveal grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 2xl:grid-cols-8 gap-4 content-start">
            <!-- Dynamic Content Injected via JS -->
        </div>

        <!-- Pagination Controls -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
            <!-- Pagination buttons will be injected here with pagination-hover class -->
        </div>
    </main>

    <footer></footer>

    <div id="petModal" class="fixed inset-0 z-[100] invisible opacity-0 flex items-center justify-center p-4 bg-slate-950/80 transition-all duration-300 pointer-events-none">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/10 rounded-[2.5rem] max-w-2xl w-full overflow-hidden transform transition-all duration-300 shadow-2xl">
             <div id="modalContent">
                <!-- Content injected via JS -->
            </div>
            <div class="p-4 bg-slate-50 dark:bg-slate-950/50 border-t border-slate-100 dark:border-white/5 flex justify-end">
                <button onclick="closeModal()" class="px-6 py-2 bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl text-sm font-normal hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors" style="font-weight: 400;">Close View</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[70] bg-blue-600 text-white px-6 py-3 rounded-2xl font-normal text-sm opacity-0 invisible translate-y-10 transition-all duration-300 pointer-events-none">Copied!</div>

    <script src="animations.js"></script>
    <script src="utils.js"></script>
    <script src="components.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
